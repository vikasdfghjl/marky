[package]
name = "marky"
version = "0.3.1"
description = "A fast Markdown editor for Windows"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-single-instance = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2"
tauri-plugin-opener = "2.5"
# Already in the tree through Tauri; used directly for WebView2's memory target (memory.rs).
webview2-com = "0.39"
windows-core = "0.62"
# System light/dark mode before any window exists (window.rs); also in the tree via Tauri's build tooling.
winreg = "0.56"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
