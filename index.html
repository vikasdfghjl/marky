<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Marky</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="toolbar">
      <nav id="tabs"></nav>
      <button id="new-tab-button" class="toolbar-button" type="button" data-command="new" aria-label="New tab" title="New tab (Ctrl+N)">+</button>
      <button id="open-button" class="toolbar-button toolbar-label-button" type="button" data-command="open" title="Open a Markdown file (Ctrl+O)">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1.5 4.5h5l1.5 1.5h6.5v7h-13z" fill="none" stroke="currentColor" stroke-linejoin="round"/><path d="M1.5 4.5v-2h4l1.5 2" fill="none" stroke="currentColor" stroke-linejoin="round"/></svg>
        <span>Open</span>
      </button>
      <button id="preview-toggle" class="toolbar-button" type="button" data-command="toggle-preview" aria-label="Hide preview" aria-pressed="true" title="Show or hide the preview (Ctrl+Shift+V)">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" />
          <path class="preview-pane" d="M8 3h6v10H8z" fill="currentColor" />
          <path d="M8 3v10" stroke="currentColor" />
        </svg>
      </button>
      <button id="editor-toggle" class="toolbar-button" type="button" data-command="toggle-editor" aria-label="Hide editor" aria-pressed="true" title="Show or hide the editor (Ctrl+Shift+E)">
        <!-- A window with its left (editor) pane filled while the editor shows. -->
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" />
          <path class="editor-pane" d="M2 3h6v10H2z" fill="currentColor" />
          <path d="M8 3v10" stroke="currentColor" />
        </svg>
      </button>
      <button id="settings-button" class="toolbar-button" type="button" data-command="settings" aria-label="Settings" title="Settings (Ctrl+,)">&#9881;&#xFE0E;</button>
    </header>
    <main id="app">
      <nav id="outline" aria-label="Outline" hidden></nav>
      <section id="editor" role="tabpanel" aria-label="Editor" aria-labelledby="tab-1" tabindex="-1"></section>
      <!-- Focusable so keyboard users can scroll it with arrow keys / Page Up / Page Down. -->
      <article id="preview" class="markdown-body" aria-label="Preview" tabindex="0"></article>
    </main>
    <!-- Not a live region: it changes on every keystroke and would flood screen readers. -->
    <footer id="status" aria-label="Status bar">
      <span id="st-pos"></span>
      <span id="st-count"></span>
      <span class="spacer"></span>
      <span id="st-render" title="Time from last keystroke to preview update"></span>
      <span id="st-perf" title="Time from process start until the editor is ready"></span>
      <span id="st-eol"></span>
      <span id="st-enc"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
