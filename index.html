<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Marky</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="toolbar">
      <nav id="tabs"></nav>
      <button id="settings-button" type="button" aria-label="Settings" title="Settings (Ctrl+,)">&#9881;&#xFE0E;</button>
    </header>
    <main id="app">
      <nav id="outline" aria-label="Outline" hidden></nav>
      <section id="editor" aria-label="Editor"></section>
      <!-- Focusable so keyboard users can scroll it with arrow keys / Page Up / Page Down. -->
      <article id="preview" class="markdown-body" aria-label="Preview" tabindex="0"></article>
    </main>
    <!-- Not a live region: it changes on every keystroke and would flood screen readers. -->
    <footer id="status" aria-label="Status bar">
      <span id="st-pos"></span>
      <span id="st-count"></span>
      <span class="spacer"></span>
      <span id="st-render" title="M0 spike: last keystroke to preview paint"></span>
      <span id="st-perf" title="M0 spike: process start to editable"></span>
      <span id="st-eol"></span>
      <span id="st-enc"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
