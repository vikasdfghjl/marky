[package]
name = "marky-diagrams"
version = "0.3.3"
edition = "2021"
publish = false
license = "MIT"
description = "Draws Mermaid diagrams as SVG for Marky, in its own process."

[[bin]]
name = "marky-diagrams"
path = "src/main.rs"

[dependencies]
# Mermaid in pure Rust: every diagram type, SVG output and the Cytoscape layout (Zed's set; the
# ELK layout and math labels are left out). MIT. About 10 MB, which is why it is a separate
# program the app starts only for documents with a diagram; see DECISION.md.
merman = { version = "0.9.3", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
