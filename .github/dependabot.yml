# Weekly dependency PRs; CI still runs npm audit and cargo audit on every build.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      codemirror:
        patterns:
          - '@codemirror/*'
          - '@lezer/*'
      tauri:
        patterns:
          - '@tauri-apps/*'

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
