# Optional performance regression check. Run manually from the Actions tab; not on every PR
# because cold-start numbers vary widely on GitHub-hosted runners.
name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - run: cargo build --release --workspace

      - name: Size budgets
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1
          ./scripts/check-size.ps1

      - name: Cold start and idle RAM
        shell: pwsh
        run: ./scripts/bench.ps1 -Runs 3
