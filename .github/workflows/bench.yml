# Optional performance regression check. Run manually from the Actions tab; not on every PR
# because cold-start numbers vary widely on GitHub-hosted runners.
name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npx tauri build --no-bundle

      - name: Size budgets
        shell: pwsh
        run: ./scripts/check-size.ps1

      - name: Cold start and idle RAM (3 runs, no trim wait)
        shell: pwsh
        run: ./scripts/bench.ps1 -Runs 3 -SkipTrimmedSample
