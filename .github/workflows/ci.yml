name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # release.yml runs this whole workflow first and publishes the installer it built and tested.
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Shortcuts agree across code, menu, tooltips and README
        run: node scripts/check-shortcuts.mjs

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests (encoding, atomic save, kill-mid-save, store)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Third-party notices are up to date
        run: |
          node scripts/third-party-notices.mjs
          git diff --exit-code THIRD_PARTY_NOTICES.txt

      - name: Audit npm dependencies
        run: npm audit --omit=dev

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

      - name: Contrast audit (WCAG AA, both themes)
        run: node scripts/contrast.mjs

      - name: Build installer (signed when the MARKY_SIGN_COMMAND secret is set)
        shell: pwsh
        env:
          MARKY_SIGN_COMMAND: ${{ secrets.MARKY_SIGN_COMMAND }}
        run: if ($env:MARKY_SIGN_COMMAND) { ./scripts/build-signed.ps1 } else { npx tauri build }

      - name: Enforce size budgets
        shell: pwsh
        run: ./scripts/check-size.ps1

      - name: End-to-end smoke test
        shell: pwsh
        run: ./scripts/e2e.ps1

      - name: Package portable ZIP
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: marky-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            marky-*-portable-x64.zip
