name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # release.yml runs this whole workflow first and publishes the installer it built and tested.
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Type-check the notice generator
        run: npx tsc --noEmit -p tsconfig.scripts.json

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (files, store, watcher, editor, preview, contrast)
        run: cargo test --workspace

      - name: Third-party notices are up to date
        run: |
          npm run notices
          git diff --exit-code THIRD_PARTY_NOTICES.txt

      - name: Audit npm dependencies
        run: npm audit

      - name: Build release programs
        run: cargo build --release --workspace

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build installer (signed when the MARKY_SIGN_COMMAND secret is set)
        shell: pwsh
        env:
          MARKY_SIGN_COMMAND: ${{ secrets.MARKY_SIGN_COMMAND }}
        run: if ($env:MARKY_SIGN_COMMAND) { ./scripts/build-signed.ps1 } else { ./scripts/build-installer.ps1 }

      - name: Enforce size budgets
        shell: pwsh
        run: ./scripts/check-size.ps1

      - name: End-to-end smoke test
        shell: pwsh
        run: ./scripts/e2e.ps1

      - name: Package portable ZIP
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: marky-windows-x64
          path: |
            dist\Marky_*_x64-setup.exe
            marky-*-portable-x64.zip
