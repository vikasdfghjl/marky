name: Release

# Pushing a tag vX.Y.Z (see scripts/release.ps1) publishes a GitHub Release, but only after the
# full CI workflow (audits, tests, size budgets, end-to-end) passes on that tag. The release
# assets are the ones CI built and tested, not a second build. 0.x versions are marked pre-release (beta).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # Cheap checks first, so a mistagged release fails in seconds instead of after the build.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches package.json version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:RELEASE_TAG) { throw "Tag $env:RELEASE_TAG does not match package.json version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: CHANGELOG.md has a section for this version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release-notes.ps1 $env:VERSION | Out-Null

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    # The build step signs when the MARKY_SIGN_COMMAND secret is set.
    secrets: inherit

  publish:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: marky-windows-x64
          path: artifact

      - name: Release notes and checksums
        shell: pwsh
        run: |
          $installer = Get-ChildItem artifact -Recurse -Filter "Marky_${env:VERSION}_x64-setup.exe" | Select-Object -First 1
          $zip = Get-ChildItem artifact -Recurse -Filter "marky-${env:VERSION}-portable-x64.zip" | Select-Object -First 1
          if (-not $installer -or -not $zip) { throw "CI artifact is missing the $env:VERSION installer or portable ZIP" }
          New-Item -ItemType Directory assets | Out-Null
          Copy-Item $installer.FullName, $zip.FullName assets
          Push-Location assets
          Get-ChildItem | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content SHA256SUMS.txt
          Pop-Location

          $notes = ./scripts/release-notes.ps1 $env:VERSION
          $install = @"
          ## Install

          Windows x64. Download ``Marky_${env:VERSION}_x64-setup.exe`` (per-user install, no admin prompt) or the portable ZIP.

          Beta builds are unsigned: if SmartScreen says *Windows protected your PC*, choose **More info**, then **Run anyway**. Verify downloads against ``SHA256SUMS.txt``.
          "@
          "$notes`n`n$install" | Set-Content release-notes.md

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $prerelease = if ($env:VERSION.StartsWith('0.')) { '--prerelease' } else { $null }
          gh release create $env:RELEASE_TAG (Get-ChildItem assets).FullName --title "Marky $env:VERSION" --notes-file release-notes.md $prerelease
